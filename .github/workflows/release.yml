name: Build & release DMG

# Every push to main builds a universal DMG and publishes it as the latest GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^project(ArrowEch VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)"
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp "dist/ArrowEch-${VERSION}.dmg" dist/ArrowEch.dmg
          gh release create "$TAG" "dist/ArrowEch-${VERSION}.dmg" dist/ArrowEch.dmg \
            --target "${{ github.sha }}" \
            --title "ArrowEch ${VERSION} (build ${{ github.run_number }})" \
            --notes "Automatic build of $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)

          Download **ArrowEch.dmg**, open it and double-click **Install ArrowEch.pkg** (if macOS blocks it: right-click > Open). Then rescan plug-ins in your DAW." \
            --latest
